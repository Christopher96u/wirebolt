[workspace]
members = [
  "crates/wirebolt-core",
  "crates/wirebolt-ffi",
  "tools/uniffi-bindgen",
]
resolver = "3"

[workspace.package]
license = "MIT"
version = "1.0.0-rc.1"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
base64 = "=0.22.1"
brotli-decompressor = "=5.0.3"
bytes = "=1.12.1"
criterion = { version = "=0.8.2", default-features = false, features = ["async_tokio", "cargo_bench_support"] }
flate2 = "=1.1.10"
http = "=1.5.0"
http-body = "=1.1.0"
http-body-util = "=0.1.5"
futures-util = { version = "=0.3.34", features = ["sink"] }
hyper = { version = "=1.11.1", features = ["http1", "http2", "server"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
percent-encoding = "=2.3.2"
reqwest = { version = "=0.13.4", default-features = false, features = ["cookies", "http2", "rustls", "socks", "stream", "system-proxy"] }
security-framework = "=3.7.0"
security-framework-sys = "=2.17.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
tokio-util = { version = "=0.7.19", features = ["io", "rt"] }
toml = "=1.1.4"
uniffi = "=0.32.0"
url = "=2.5.8"
yaml-rust2 = { version = "=0.13.0", default-features = false }
wirebolt-core = { path = "crates/wirebolt-core" }
zstd = "=0.13.3"

[workspace.lints.rust]
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "fat"
strip = "debuginfo"
