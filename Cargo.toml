[workspace]
members = [
  "crates/wirebolt-core",
  "crates/wirebolt-ffi",
  "tools/uniffi-bindgen",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
http = "=1.5.0"
serde = { version = "=1.0.229", features = ["derive"] }
tempfile = "=3.27.0"
toml = "=1.1.4"
uniffi = "=0.32.0"
wirebolt-core = { path = "crates/wirebolt-core" }

[workspace.lints.rust]
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
