name: Bug report
description: Report a reproducible problem in Wirebolt.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Use demo data. Do not include credentials, cookies or private responses. For vulnerabilities, read SECURITY.md before posting.
  - type: input
    id: version
    attributes:
      label: Wirebolt version or source commit
      placeholder: 0.1.0-beta.2 or commit hash
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS version and chip
      placeholder: macOS 15.6, Apple M2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include a minimal request against a local or non-sensitive endpoint when possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include redacted errors or screenshots if useful.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Configuration and performance context
      description: Proxy scope/mode, selected environment, response size, request/tab count, and whether restarting changes the result.
