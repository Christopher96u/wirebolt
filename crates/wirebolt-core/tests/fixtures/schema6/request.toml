schema_version = 6
id = "health"
name = "Health"
group_id = "child"
order = 3
method = "POST"
url = "https://example.com/health"
web_socket = true
note = "Fixture notes"
inherits_workspace_transport = false

[[query]]
id = "query"
name = "search"
value = "fixture"
enabled = true
sensitive = true

[[headers]]
id = "header"
name = "Authorization"
value = { secret = "fixture.api-token" }
enabled = true
sensitive = true

[authentication]
kind = "basic"
username = "fixture"
password = { secret = "fixture.password" }

[body]
kind = "text"
content_type = "application/json"
value = "{}"

[proxy_override]
mode = "direct"

[transport]
validate_tls = true
follow_redirects = false
maximum_redirects = 10
total_timeout_ms = 30000
read_timeout_ms = 10000
client_certificate_reference = "fixture.client-certificate"
custom_ca_path = "/fixture/ca.pem"
